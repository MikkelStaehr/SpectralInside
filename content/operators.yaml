# De analytikere, der bruger instrumentet.
#
# Er listen tom, beder login-siden om initialer som fritekst. Det virker, men
# fritekst betyder, at den samme person over tid kan stå som "MSM", "msm" og
# "Mikkel" i vedligeholdelsesloggen, og så kan man ikke længere se, hvem der
# gjorde hvad.
#
# Skriv de fire ind her, så vælger man bare sig selv, og loggen bliver ens.
# Eksempel:
#
# role styrer, hvad der vises i menuen. Der er tre, fordi der er tre slags
# arbejde, og de har ikke brug for hinandens sider:
#
#   analytiker    standard. Instrumentet, prøverne, procedurerne, wikien.
#   ordrekontor   lægger ordrer ind. Ser ordrebogen og ingenting andet.
#   udvikler      bygger modeller. Ser det hele.
#
# Operatøren ude ved linjen står ikke på listen. Produktionsskærmen ligger
# foran login, fordi det at skulle taste initialer for at læse et tal er
# friktion uden formål.
#
# Det er oprydning, ikke adgangskontrol: der er ingen indlogning, og intet er
# beskyttet. Er listen tom, vises alt til alle, så ingenting er usynligt under
# opsætningen.
#
# operators:
#   - initials: MSM
#     name: Mikkel Stæhr Madsen
#     role: udvikler
#   - initials: HE
#     name: ...
#   - initials: ML
#     name: ...
#   - initials: JTH
#     name: ...
#   - initials: OK
#     name: Ordrekontoret
#     role: ordrekontor

# ADVARSEL: de to herunder er sat ind, for at rollerne kan prøves. Skriv de
# rigtige navne og initialer, og slet det, der ikke passer. Så længe listen kun
# indeholder gætterier, kommer der gætterier i vedligeholdelsesloggen.
operators:
  - initials: MSM
    name: Mikkel Stæhr Madsen
    role: udvikler
  - initials: OK
    name: Ordrekontoret
    role: ordrekontor
