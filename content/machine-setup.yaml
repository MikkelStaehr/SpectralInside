# Opsætning af linjen, som operatøren registrerer pr. lot.
#
# Maskinerne fortæller ikke selv, hvordan de er sat op, og derfor gør
# operatøren det. Formålet er ikke dokumentation for dokumentationens skyld:
# uden opsætningen kan man ikke bagefter se, hvilke indstillinger der gav
# hvilke tal, og så er en god prøve bare heldig.
#
# Filen ligger i git, fordi den styrer hvad der bliver spurgt om. Ret den her,
# genindlæs siden, så er ændringen der. Ingen genstart.
#
# Felter pr. indstilling:
#   id       unikt inden for hele filen, bruges som nøgle i databasen
#   label    det operatøren læser
#   type     number, text eller choice
#   unit     vises efter feltet, valgfri
#   options  kun for choice
#   hint     kort forklaring under feltet, valgfri

groups:
  # De fire herunder er skrevet af fra driftsrapportens egen "Opsætning"-blok
  # (Indskriv B19:C23) og er dermed de rigtige. En tidligere udgave af filen
  # gættede på sold, luftstrøm og slibetryk pr. trin. Det gæt er væk: linjen
  # sættes op ét sted og ikke tre.
  #
  # Enhederne er stadig et gæt. "ø" læses som diameter, altså mm, og
  # "Bundsold #" som en maskenummerbetegnelse frem for et mål. Ret det, hvis
  # det er forkert — det er ét sted.
  - id: linje
    title: Opsætning
    lead: Sådan er linjen sat op til dette parti.
    settings:
      - id: soldopsaetning_foroven_diameter
        label: Foroven ø
        type: number
        unit: mm
      - id: soldopsaetning_bundsold_nr
        label: Bundsold #
        type: text
        hint: Maskenummeret, som det står på soldet
      - id: soldopsaetning_forneden_diameter
        label: Forneden ø
        type: number
        unit: mm
      - id: soldopsaetning_bundsold_diameter
        label: Bundsold ø
        type: number
        unit: mm

  # De fire herunder svarer til de [!UDFYLD]-blokke, der stadig står åbne i
  # procedurerne. De står ikke i driftsrapporten, fordi de hører til
  # analysen og ikke til renselinjen. Registreres de pr. lot, kan man bagefter
  # se, om to lots blev målt ens, og det er hele grunden til at applikationen
  # findes.
  - id: analyse
    title: Analyse
    lead: VideometerLab og Autofeeder.
    settings:
      - id: vm_recept
        label: Recept
        type: text
        hint: Navnet præcis som det står i VideometerLab
      - id: vm_spacer
        label: Spacer
        type: text
        hint: Hvilken bruges til roefrø
      - id: vm_drift_correction
        label: Drift correction
        type: choice
        options: [Til, Fra]
        hint: Skal være den samme hver gang
      - id: vm_klassifikator
        label: Klassifikator
        type: text
        hint: Modelnavn og version
